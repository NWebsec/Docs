title: "NWebsec.AzureStartupTasks"
description: "TLS hardening for Azure web roles"
theme: just-the-docs

# Served at a deep path prefix on the same custom domain as the main site
# (https://docs.nwebsec.com/projects/AzureStartupTasks/en/latest/), mirroring
# the old readthedocs "subprojects" URL scheme -- NOT at the domain apex.
# baseurl must be non-empty here so just-the-docs' internal nav/search/asset
# links resolve under the full path instead of at the domain root.
url: https://docs.nwebsec.com
baseurl: "/projects/AzureStartupTasks/en/latest"

# Apply the just-the-docs layout (with sidebar nav) to every page.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# just-the-docs options
search_enabled: true
heading_anchors: true
aux_links:
  "NWebsec.AzureStartupTasks on GitHub":
    - "https://github.com/NWebsec/NWebsec.AzureStartupTasks"

# Color scheme supports "light" (default) and "dark"
color_scheme: dark

ga_tracking: G-BKRFKNBFX9
# Don't process the converted-from source or build helpers.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
