# Builds the docs/ Jekyll site (Jekyll 4.4 + just-the-docs gem theme) with the
# project's own Gemfile and deploys it to GitHub Pages.
#
# NOTE: we do NOT use actions/jekyll-build-pages here. That action builds inside
# GitHub's preinstalled `github-pages` gem environment (Jekyll 3.9, built-in
# theme allowlist), which does not include just-the-docs and would render the
# site unstyled. Instead we build with ruby/setup-ruby + bundler so the exact
# gems we verified locally are used.
name: Deploy Jekyll docs to GitHub Pages

on:
  # Runs on pushes to the branch your docs land on; only when docs change.
  # Triggering from gh-pages for now to test the deploy; switch to master later.
  push:
    branches: ["gh-pages"]
    paths:
      - "docs/**"
      - ".github/workflows/jekyll-gh-pages.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs   # the Jekyll site + Gemfile live here
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true       # runs bundle install and caches gems
          working-directory: docs
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        # base_path is empty for the docs.nwebsec.com custom domain,
        # matching baseurl: "" in _config.yml.
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # path is relative to the repo root, not working-directory.
          path: docs/_site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
