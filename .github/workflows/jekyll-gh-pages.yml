# Builds the docs/ Jekyll site (Jekyll 4.4 + just-the-docs gem theme) with the
# project's own Gemfile and deploys it to GitHub Pages.
#
# NOTE: we do NOT use actions/jekyll-build-pages here. That action builds inside
# GitHub's preinstalled `github-pages` gem environment (Jekyll 3.9, built-in
# theme allowlist), which does not include just-the-docs and would render the
# site unstyled. Instead we build with ruby/setup-ruby + bundler so the exact
# gems we verified locally are used.
name: Deploy Jekyll docs to GitHub Pages

on:
  # Runs on pushes to the branch your docs land on; only when docs change.
  # Triggering from gh-pages for now to test the deploy; switch to master later.
  push:
    branches: ["gh-pages"]
    paths:
      - "docs/**"
      - "docs-aspnet4/**"
      - ".github/workflows/jekyll-gh-pages.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build the ASP.NET Core docs (docs/), served at the domain apex.
  build-main:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs   # the Jekyll site + Gemfile live here
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true       # runs bundle install and caches gems
          working-directory: docs
      - name: Build with Jekyll
        # The site is served at the apex of the docs.nwebsec.com custom domain,
        # so baseurl must be empty (as set in _config.yml). We deliberately do
        # NOT use steps.pages.outputs.base_path here: until the custom domain is
        # active, that resolves to the project-site path "/Docs" and would
        # prefix every link/asset with /Docs.
        run: bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: production
      - name: Upload main site build
        uses: actions/upload-artifact@v5
        with:
          name: site-main
          path: docs/_site
          retention-days: 1

  # Build the classic ASP.NET 4 docs (docs-aspnet4/) as a fully separate
  # Jekyll site/build, so it gets its own just-the-docs sidebar nav instead
  # of merging into docs/'s nav tree (just-the-docs' nav is global per build).
  build-aspnet4:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-aspnet4
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs-aspnet4
      - name: Build with Jekyll
        # This site is served at a path prefix (docs.nwebsec.com/en/aspnet4/),
        # not the domain apex, so baseurl must be non-empty here -- the
        # opposite of build-main above -- for just-the-docs' nav/asset links
        # to resolve under /en/aspnet4 instead of at the domain root.
        run: bundle exec jekyll build --baseurl "/en/aspnet4"
        env:
          JEKYLL_ENV: production
      - name: Upload aspnet4 site build
        uses: actions/upload-artifact@v5
        with:
          name: site-aspnet4
          path: docs-aspnet4/_site
          retention-days: 1

  # Combine both builds into one artifact tree. GitHub Pages only accepts one
  # deploy artifact per run, and Jekyll's baseurl only affects generated links,
  # not physical output location -- so build-aspnet4's output (flat at its own
  # _site root) must be explicitly placed under en/aspnet4/ here.
  combine:
    runs-on: ubuntu-latest
    needs: [build-main, build-aspnet4]
    steps:
      - name: Download main site build
        uses: actions/download-artifact@v5
        with:
          name: site-main
          path: _combined
      - name: Download aspnet4 site build into en/aspnet4/
        uses: actions/download-artifact@v5
        with:
          name: site-aspnet4
          path: _combined/en/aspnet4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload combined artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _combined

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: combine
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
